        };

        // --- 工具函数 ---
        const loadScript = (src) => {
            return new Promise((resolve, reject) => {
                if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        };

        const calculateFrameDifference = (data1, data2) => {
            if (!data1 || !data2) return 100;
            let diff = 0;
            const len = data1.length;
            for (let i = 0; i < len; i += 4) {
                diff += Math.abs(data1[i] - data2[i]) + Math.abs(data1[i + 1] - data2[i + 1]) + Math.abs(data1[i + 2] - data2[i + 2]);
            }
            return (diff / (len / 4 * 3 * 255)) * 100;
        };

        const getDominantColor = (ctx, width, height) => {
            try {
                const data = ctx.getImageData(0, 0, width, height).data;
                let r = 0, g = 0, b = 0;
                const count = data.length / 4;
                for (let i = 0; i < data.length; i += 40) { r += data[i]; g += data[i+1]; b += data[i+2]; }
                const sampleCount = Math.ceil(count / 10);
                return `rgb(${Math.floor(r/sampleCount)}, ${Math.floor(g/sampleCount)}, ${Math.floor(b/sampleCount)})`;
            } catch (e) { return '#000'; }
        };

        const analyzeImageWithGemini = async (base64Data, prompt, apiKey) => {
            if (!apiKey) return ""; 
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: "image/jpeg", data: base64Data } }] }] })
                });
                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
            } catch (error) { console.error("Gemini Error", error); return `Error: ${error.message}`; }
        };

        // --- Tech Background ---
        const TechBackground = () => {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let width, height, particles = [];
                const resize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; initParticles(); };
                const initParticles = () => {
                    particles = [];
                    const count = Math.floor((width * height) / 15000);
                    for (let i = 0; i < count; i++) particles.push({ x: Math.random() * width, y: Math.random() * height, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5, size: Math.random() * 2 + 1 });
                };
                const draw = () => {
                    ctx.clearRect(0, 0, width, height);
                    ctx.fillStyle = 'rgba(129, 140, 248, 0.2)'; 
                    ctx.strokeStyle = 'rgba(99, 102, 241, 0.1)';
                    for (let i = 0; i < particles.length; i++) {
                        let p = particles[i];
                        p.x += p.vx; p.y += p.vy;
                        if (p.x < 0 || p.x > width) p.vx *= -1;
                        if (p.y < 0 || p.y > height) p.vy *= -1;
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                        for (let j = i + 1; j < particles.length; j++) {
                            let p2 = particles[j];
                            let dist = Math.sqrt((p.x - p2.x)**2 + (p.y - p2.y)**2);
                            if (dist < 120) { ctx.lineWidth = 1 - dist / 120; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); }
                        }
                    }
                    requestAnimationFrame(draw);
                };
                window.addEventListener('resize', resize); resize(); draw();
                return () => window.removeEventListener('resize', resize);
            }, []);
            return <canvas ref={canvasRef} className="fixed inset-0 w-full h-full pointer-events-none z-0" style={{background: 'radial-gradient(circle at center, #1e293b 0%, #0f172a 100%)'}} />;
        };

        // --- 模态框 (增强版：支持自定义按钮) ---
        const Modal = ({ isOpen, title, message, type = 'alert', onConfirm, onCancel, customButtons, texts }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 fade-in">
                    <div className="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden slide-in">
                        <div className="p-5">
                            <h3 className="text-lg font-bold text-white mb-2 flex items-center gap-2">
                                {type === 'danger' && <Trash2 size={20} className="text-red-500"/>}
                                {type === 'success' && <Check size={20} className="text-green-500"/>}
                                {type === 'switch' && <RotateCcw size={20} className="text-amber-500"/>}
                                {title}
                            </h3>
                            <p className="text-slate-300 text-sm leading-relaxed whitespace-pre-wrap">{message}</p>
                        </div>
                        <div className="bg-slate-950/50 p-4 flex justify-end gap-3 border-t border-slate-800">
                            {customButtons ? (
                                <>
                                    <button onClick={onCancel} className="px-4 py-2 text-sm text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">{texts.cancel}</button>
                                    {customButtons.map((btn, idx) => (
                                        <button key={idx} onClick={btn.onClick} className={`px-4 py-2 text-sm font-medium rounded-lg shadow-lg active:scale-95 ${btn.className}`}>
                                            {btn.label}
                                        </button>
                                    ))}
                                </>
                            ) : (
                                <>
                                    {(type === 'confirm' || type === 'danger') && (
                                        <button onClick={onCancel} className="px-4 py-2 text-sm text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">{texts.cancel}</button>
                                    )}
                                    <button onClick={onConfirm} className={`px-4 py-2 text-sm font-medium rounded-lg shadow-lg active:scale-95 ${type === 'danger' ? 'bg-red-500 text-white' : 'bg-indigo-600 text-white'}`}>{texts.confirm}</button>

                            )}

                </div>
            );
        };

        const SettingsModal = ({ isOpen, onClose, apiKey, setApiKey, t }) => {
            if (!isOpen) return null;
            const [tempKey, setTempKey] = React.useState(apiKey);
            const handleSave = () => { setApiKey(tempKey); localStorage.setItem('gemini_api_key', tempKey); onClose(); };
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 fade-in">
                    <div className="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden slide-in">
                        <div className="p-6 space-y-4">
                            <div className="flex justify-between items-center">
                                <h3 className="text-xl font-bold text-white flex items-center gap-2"><Settings className="w-5 h-5 text-indigo-400" /> {t.settingsTitle}</h3>
                                <button onClick={onClose} className="text-slate-500 hover:text-white"><X size={20} /></button>
                            </div>
                            <div className="space-y-2">
                                <label className="text-sm font-medium text-slate-300 flex items-center gap-2"><Key size={14} /> {t.apiKeyLabel}</label>
                                <input type="password" value={tempKey} onChange={(e) => setTempKey(e.target.value)} placeholder={t.apiKeyPlaceholder} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-sm text-white focus:ring-2 focus:ring-indigo-500 outline-none" />
                                <p className="text-xs text-slate-500">{t.apiKeyHelp}</p>
                                <p className="text-xs text-indigo-400 mt-2 font-medium">{t.apiKeyTip}</p>
                            </div>
                        </div>
                        <div className="bg-slate-950/50 p-4 flex justify-end border-t border-slate-800"><button onClick={handleSave} className="px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg shadow-lg transition-all active:scale-95">{t.save}</button></div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [lang, setLang] = useState('zh');
            const t = TRANSLATIONS[lang];
            const [apiKey, setApiKey] = useState(() => localStorage.getItem('gemini_api_key') || '');
            const [showSettings, setShowSettings] = useState(false);
            
            const [videoFile, setVideoFile] = useState(null);
            const [videoSrc, setVideoSrc] = useState(null);
            const [frames, setFrames] = useState([]);
            const [selectedFrameIds, setSelectedFrameIds] = useState(new Set());
            
            const [intervalSec, setIntervalSec] = useState(1);
            const [sceneThreshold, setSceneThreshold] = useState(15);
            const [minSceneDuration, setMinSceneDuration] = useState(0.5);
            const [activeTab, setActiveTab] = useState('interval');
            
            const [isProcessing, setIsProcessing] = useState(false);
            const [progress, setProgress] = useState(0);
            const [processStatus, setProcessStatus] = useState('');
            const [dragActive, setDragActive] = useState(false);
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            
            // Modal Config State
            const [modalConfig, setModalConfig] = useState({ isOpen: false, title: '', message: '', type: 'alert', onConfirm: () => {}, customButtons: null });
            
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const processingCanvasRef = useRef(null);
            const fileInputRef = useRef(null);

            useEffect(() => { const loader = document.getElementById('loading-screen'); if (loader) loader.style.display = 'none'; }, []);

            useEffect(() => {
                setFrames(prev => prev.map(frame => {
                    const timeStr = frame.time.toFixed(2);
                    const zhDef = `${TRANSLATIONS.zh.timePoint}: ${timeStr}s`;
                    const enDef = `${TRANSLATIONS.en.timePoint}: ${timeStr}s`;
                    if (frame.description === zhDef || frame.description === enDef) return { ...frame, description: `${t.timePoint}: ${timeStr}s` };
                    return frame;
                }));
            }, [lang, t]);

            // 通用 Modal 控制
            const showModal = (config) => {
                setModalConfig({ 
                    isOpen: true, 
                    title: config.title || '', 
                    message: config.message || '', 
                    type: config.type || 'alert', 
                    onConfirm: () => { if(config.onConfirm) config.onConfirm(); closeModal(); }, 
                    onCancel: closeModal,
                    customButtons: config.customButtons || null
                });
            };
            const closeModal = () => setModalConfig(prev => ({ ...prev, isOpen: false }));

            // 核心业务逻辑
            const handleFile = (file) => {
                if (file && file.type.startsWith('video/')) {
                    if (videoSrc) URL.revokeObjectURL(videoSrc);
                    setVideoFile(file);
                    setVideoSrc(URL.createObjectURL(file));
                    setFrames([]);
                    setSelectedFrameIds(new Set());
                    setIsPlaying(false);
                } else { showModal({title: t.modalError, message: t.msgFileError, type: 'alert'}); }
            };

            const handleRemoveVideo = () => {
                showModal({
                    title: t.modalConfirm,
                    message: t.msgRemoveVideoConfirm,
                    type: 'danger',
                    onConfirm: () => {
                        if (videoSrc) URL.revokeObjectURL(videoSrc);
                        setVideoFile(null);
                        setVideoSrc(null);
                        setFrames([]);
                        setSelectedFrameIds(new Set());
                        setIsPlaying(false);
                        setCurrentTime(0);
                        setDuration(0);
                    }
                });
            };

            const handleTabChange = (targetTab) => {
                if (activeTab === targetTab) return;

                if (frames.length > 0) {
                    showModal({
                        title: t.modalConfirm,
                        message: t.msgSwitchClear,
                        type: 'switch',
                        customButtons: [
                            {
                                label: t.keepAndSwitch,
                                className: "bg-slate-700 hover:bg-slate-600 text-white",
                                onClick: () => { setActiveTab(targetTab); closeModal(); }
                            },
                            {
                                label: t.clearAndSwitch,
                                className: "bg-indigo-600 hover:bg-indigo-500 text-white",
                                onClick: () => { 
                                    setFrames([]); 
                                    setSelectedFrameIds(new Set()); 
                                    setActiveTab(targetTab); 
                                    closeModal(); 
                                }
                            }
                        ]
                    });
                } else {
                    setActiveTab(targetTab);
                }
            };

            const captureFrame = (video, time, meta = {}) => {
                const canvas = canvasRef.current; const ctx = canvas.getContext('2d');
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const color = getDominantColor(ctx, canvas.width, canvas.height);
                return { id: Date.now() + Math.random(), dataUrl: canvas.toDataURL('image/jpeg', 0.85), time: time, width: canvas.width, height: canvas.height, description: `${t.timePoint}: ${time.toFixed(2)}s`, meta: { color, ...meta } };
            };

            const extractLastFrame = async () => {
                if (!videoRef.current) return;
                setIsProcessing(true);
                const video = videoRef.current; const originalTime = video.currentTime; const wasPlaying = !video.paused; if(wasPlaying) video.pause();
                try {
                    const targetTime = Math.max(0, video.duration - 0.1);
                    video.currentTime = targetTime;
                    await new Promise(r => { video.addEventListener('seeked', r, { once: true }); });
                    const frame = captureFrame(video, targetTime);
                    setFrames(prev => [frame, ...prev]);
                } catch (e) { showModal({title: t.modalError, message: "截取失败", type: 'alert'}); } 
                finally { video.currentTime = originalTime; setIsProcessing(false); if(wasPlaying) video.play(); }
            };

            const detectSceneChanges = async () => {
                if (!videoRef.current) return;
                setIsProcessing(true); setProcessStatus(t.analyzing);
                const video = videoRef.current; video.pause();
                const newFrames = []; let lastSavedTime = -minSceneDuration; let prevImageData = null;
                const diffCtx = processingCanvasRef.current.getContext('2d', { willReadFrequently: true });
                processingCanvasRef.current.width = 64; processingCanvasRef.current.height = 64; const step = 0.2; let currentTimeCursor = 0; const totalDuration = video.duration;
                try {
                    video.currentTime = 0; await new Promise(r => { video.addEventListener('seeked', r, { once: true }); });
                    diffCtx.drawImage(video, 0, 0, 64, 64); prevImageData = diffCtx.getImageData(0, 0, 64, 64).data;
                    newFrames.push(captureFrame(video, 0, { diffScore: 100 })); lastSavedTime = 0; currentTimeCursor += step;
                    while (currentTimeCursor < totalDuration) {
                        setProgress(Math.round((currentTimeCursor / totalDuration) * 100));
                        video.currentTime = currentTimeCursor; await new Promise(r => { video.addEventListener('seeked', r, { once: true }); });
                        diffCtx.drawImage(video, 0, 0, 64, 64); const currentImageData = diffCtx.getImageData(0, 0, 64, 64).data;
                        const diff = calculateFrameDifference(prevImageData, currentImageData);
                        if (diff > sceneThreshold && (currentTimeCursor - lastSavedTime) >= minSceneDuration) {
                            newFrames.push(captureFrame(video, currentTimeCursor, { diffScore: diff.toFixed(1) })); lastSavedTime = currentTimeCursor;
                        }
                        prevImageData = currentImageData; currentTimeCursor += step;
                    }
                    setFrames(prev => [...prev, ...newFrames]); showModal({title: t.modalSuccess, message: `${t.results}: ${newFrames.length}`, type: 'success'});
                } catch (e) { console.error(e); showModal({title: t.modalError, message: e.message, type: 'alert'}); } 
                finally { setIsProcessing(false); setProgress(0); setProcessStatus(''); video.currentTime = 0; }
            };

            const extractByInterval = async () => {
                if (!videoRef.current || intervalSec <= 0) return;
                setIsProcessing(true); setProcessStatus(t.intervalExtract);
                const video = videoRef.current; video.pause();
                const newFrames = []; let currentTimeCursor = 0; const totalDuration = video.duration;
                try {
                    while (currentTimeCursor <= totalDuration) {
                        setProgress(Math.round((currentTimeCursor / totalDuration) * 100));
                        video.currentTime = currentTimeCursor; await new Promise(r => { video.addEventListener('seeked', r, { once: true }); });
                        newFrames.push(captureFrame(video, currentTimeCursor)); currentTimeCursor += parseFloat(intervalSec);
                    }
                    setFrames(prev => [...prev, ...newFrames]); showModal({title: t.modalSuccess, message: `${t.results}: ${newFrames.length}`, type: 'success'});
                } catch (e) { console.error(e); } 
                finally { setIsProcessing(false); setProgress(0); setProcessStatus(''); video.currentTime = 0; }
            };

            const runBatchAIAnalysis = async () => {
                if (frames.length === 0) return;
                if (!apiKey) { setShowSettings(true); setTimeout(() => alert(t.noKeyError), 100); return; }
                setIsProcessing(true); setProcessStatus(t.aiAnalyzing); let completed = 0;
                for (let i = 0; i < frames.length; i++) {
                    try {
                        if (i > 0) await new Promise(r => setTimeout(r, 800));
                        const desc = await analyzeImageWithGemini(frames[i].dataUrl.split(',')[1], t.aiPrompt, apiKey);
                        if (desc) setFrames(prev => { const next = [...prev]; if(next[i]) next[i].description = desc.trim(); return next; });
                    } catch (e) { console.error(e); }
                    completed++; setProgress(Math.round((completed / frames.length) * 100));
                }
                setIsProcessing(false); setProgress(0); showModal({title: t.modalSuccess, message: t.msgAiComplete, type: 'success'});
            };

            const downloadZip = () => {
                if (!window.JSZip) return showModal({title: t.modalError, message: t.librariesLoading, type: 'alert'});
                const zip = new window.JSZip(); const folder = zip.folder("extracted_frames");
                frames.forEach((frame, index) => {
                    const safeDesc = frame.description.replace(/[^a-z0-9\u4e00-\u9fa5]/gi, '_').substring(0, 30);
                    folder.file(`frame_${index}_${frame.time.toFixed(2)}s_${safeDesc}.jpg`, frame.dataUrl.split(',')[1], { base64: true });
                });
                zip.generateAsync({ type: "blob" }).then(content => window.saveAs(content, "frames.zip"));
            };

            // --- 使用 ExcelJS 导出带图片的分镜表 ---
            const downloadStoryboard = async () => {
                if (!window.ExcelJS) return showModal({title: t.modalError, message: t.librariesLoading, type: 'alert'});
                
                // 1. 创建工作簿
                const workbook = new ExcelJS.Workbook();
                const worksheet = workbook.addWorksheet('Storyboard');

                // 2. 设置列头
                worksheet.columns = [
                    { header: '序号 (No.)', key: 'no', width: 8 },
                    { header: '画面 (Image)', key: 'image', width: 24 }, // 约对应 200px 宽
                    { header: '时间点 (Time)', key: 'time', width: 12 },
                    { header: '景别 (Shot)', key: 'shot', width: 15 },
                    { header: '风格 (Style)', key: 'style', width: 15 },
                    { header: '构图 (Composition)', key: 'comp', width: 15 },
                    { header: '画面内容 (Content)', key: 'content', width: 40 },
                    { header: '主色 (Color)', key: 'color', width: 12 }
                ];

                // 3. 填充数据和图片
                for (let i = 0; i < frames.length; i++) {
                    const frame = frames[i];
                    
                    // 解析AI返回的结构化描述
                    let shot = "", style = "", composition = "", content = frame.description;
                    const shotMatch = frame.description.match(/【景别[：:]\s*(.*?)】/);
                    const styleMatch = frame.description.match(/【风格[：:]\s*(.*?)】/);
                    const compMatch = frame.description.match(/【构图[：:]\s*(.*?)】/);
                    
                    const shotMatchEn = frame.description.match(/\[Shot[：:]\s*(.*?)\]/i);
                    const styleMatchEn = frame.description.match(/\[Style[：:]\s*(.*?)\]/i);
                    const compMatchEn = frame.description.match(/\[Composition[：:]\s*(.*?)\]/i);

                    if(shotMatch) shot = shotMatch[1]; else if(shotMatchEn) shot = shotMatchEn[1];
                    if(styleMatch) style = styleMatch[1]; else if(styleMatchEn) style = styleMatchEn[1];
                    if(compMatch) composition = compMatch[1]; else if(compMatchEn) composition = compMatchEn[1];
                    
                    content = frame.description.replace(/【.*?】|\[.*?\]/g, '').trim();

                    // 添加文字行
                    const row = worksheet.addRow({
                        no: i + 1,
                        image: '', // 图片占位
                        time: `${frame.time.toFixed(2)}s`,
                        shot: shot || "-",
                        style: style || "-",
                        comp: composition || "-",
                        content: content || frame.description,
                        color: frame.meta.color || "-"
                    });

                    // 设置行高以容纳图片 (单位: points, 90pts ≈ 120px)
                    row.height = 90;

                    // 设置垂直居中
                    row.eachCell({ includeEmpty: true }, (cell) => {
                        cell.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
                        if(cell.col === 1) cell.alignment.horizontal = 'center'; // 序号居中
                    });

                    // 添加图片到 Workbook
                    const base64Data = frame.dataUrl.split(',')[1];
                    const imageId = workbook.addImage({
                        base64: base64Data,
                        extension: 'jpeg',
                    });

                    // 将图片放置在第二列 (B列) 的对应行
                    // tl: top-left { col: 1.1, row: i + 1.1 } (加一点padding)
                    worksheet.addImage(imageId, {
                        tl: { col: 1.05, row: i + 1.05 }, // B列索引为1，行索引需加1（因为有表头）
                        br: { col: 1.95, row: i + 1.95 }, // 稍微留一点边距
                        editAs: 'oneCell' // 图片随单元格大小变化
                    });
                }

                // 4. 样式美化 (表头)
                const headerRow = worksheet.getRow(1);
                headerRow.font = { bold: true, color: { argb: 'FFFFFFFF' } };
                headerRow.alignment = { vertical: 'middle', horizontal: 'center' };
                headerRow.height = 24;
                headerRow.eachCell((cell) => {
                    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF4F46E5' } }; // Indigo-600
                });

                // 5. 导出文件
                const buffer = await workbook.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                window.saveAs(blob, "storyboard_分镜表.xlsx");
            };

                                </div>
                                <div className="flex items-center gap-4">
                                    <button onClick={() => setShowSettings(true)} className={`p-2 rounded-lg transition-all ${apiKey ? 'text-slate-400 hover:text-indigo-400' : 'text-amber-400 animate-pulse hover:text-amber-300'}`} title={t.settingsTitle}><Settings size={20} /></button>

                                <div className="bg-slate-900/80 backdrop-blur-sm rounded-xl border border-slate-800 p-6 mt-8">
                                    <div className="flex items-center gap-2 mb-4 text-slate-400 text-sm font-medium uppercase tracking-wider justify-center md:justify-start"><QrCode size={16}/>{t.qrTitle}</div>
                                    <div className="flex flex-col md:flex-row gap-6 justify-center md:justify-start">
                                        <div className="flex flex-col items-center gap-2">
                                            <div className="w-32 h-32 bg-white rounded-lg p-2 flex items-center justify-center border-2 border-indigo-500/20 shadow-lg"><img src="wechat.png" alt="QR 1" className="w-full h-full opacity-80" /></div>
                                            <span className="text-xs text-slate-500 font-medium">{t.qrLabel1}</span>
                                        </div>
                                        <div className="flex flex-col items-center gap-2">
                                            <div className="w-32 h-32 bg-white rounded-lg p-2 flex items-center justify-center border-2 border-purple-500/20 shadow-lg"><img src="addme.jpg" alt="QR 2" className="w-full h-full opacity-80" /></div>
                                            <span className="text-xs text-slate-500 font-medium">{t.qrLabel2}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="lg:col-span-5 flex flex-col h-[600px] lg:h-[calc(100vh-8rem)]">
                                <div className="bg-slate-900/80 backdrop-blur-sm rounded-2xl border border-slate-800 shadow-xl flex flex-col h-full overflow-hidden">
                                    <div className="p-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur z-10">
                                        <div className="flex justify-between items-center mb-3">
                                            <div className="flex items-center gap-2"><ImageIcon className="w-4 h-4 text-indigo-400" /><span className="font-semibold text-sm">{t.results} ({frames.length})</span></div>
                                            <div className="flex gap-2">
                                                <button onClick={()=>{if(selectedFrameIds.size===frames.length)setSelectedFrameIds(new Set());else setSelectedFrameIds(new Set(frames.map(f=>f.id)))}} className="text-[10px] px-2 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-300">{selectedFrameIds.size===frames.length&&frames.length>0?t.deselect:t.selectAll}</button>
                                                <button onClick={clearAllFrames} className="text-[10px] px-2 py-1 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 rounded transition-colors">{t.clearAll}</button>

                                        {frames.length>0 && <button onClick={runBatchAIAnalysis} disabled={isProcessing} className="w-full mb-3 py-2 bg-gradient-to-r from-emerald-600/20 to-teal-600/20 border border-emerald-500/30 hover:border-emerald-500/60 text-emerald-300 text-xs font-bold rounded flex items-center justify-center gap-2 transition-all group"><Sparkles size={14} className="group-hover:text-emerald-200 group-hover:scale-110 transition-transform"/>{t.aiAnalyzeAll}</button>}
                                        {selectedFrameIds.size>0 && <div className="flex gap-2 animate-fade-in"><button onClick={()=>{setFrames(frames.filter(f=>!selectedFrameIds.has(f.id)));setSelectedFrameIds(new Set())}} className="flex-1 py-1.5 bg-red-600 text-white text-xs rounded flex items-center justify-center gap-1"><Trash2 size={12}/>{t.deleteSelected} ({selectedFrameIds.size})</button></div>}

                                                                {frame.meta.diffScore&&<div className="flex items-center gap-1 text-[10px] text-purple-400 bg-purple-900/20 px-1.5 py-0.5 rounded"><Zap size={8}/>{t.changeScore}: {frame.meta.diffScore}%</div>}
                                                            </div>
                                                            <a href={frame.dataUrl} download={`frame_${frame.time}.jpg`} className="p-1.5 bg-slate-800 hover:bg-slate-700 rounded text-slate-400 hover:text-white transition-colors"><Download size={14}/></a>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                    <div className="p-4 border-t border-slate-800 bg-slate-900 space-y-3">
                                        <button onClick={downloadStoryboard} disabled={frames.length===0} className="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl border border-slate-700 flex items-center justify-center gap-2 transition-all disabled:opacity-50"><FileSpreadsheet size={18}/>{t.downloadXlsx}</button>
                                        <button onClick={downloadZip} disabled={frames.length===0} className="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold rounded-xl shadow-lg flex items-center justify-center gap-2 transition-all disabled:opacity-50 disabled:cursor-not-allowed"><FileVideo size={18}/>{t.downloadZip}</button>
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        // 启动应用
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
