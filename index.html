        // --- 工具函数 ---
        const calculateFrameDifference = (d1, d2) => { let diff = 0; const len = d1.length; for (let i = 0; i < len; i += 4) { diff += Math.abs(d1[i] - d2[i]) + Math.abs(d1[i + 1] - d2[i + 1]) + Math.abs(d1[i + 2] - d2[i + 2]); } return (diff / (len / 4 * 3 * 255)) * 100; };
        const getDominantColor = (ctx, w, h) => { try { const d = ctx.getImageData(0,0,w,h).data; let r=0,g=0,b=0,c=d.length/4; for(let i=0;i<d.length;i+=40){r+=d[i];g+=d[i+1];b+=d[i+2];} const s=Math.ceil(c/10); return `rgb(${Math.floor(r/s)},${Math.floor(g/s)},${Math.floor(b/s)})`; } catch{return '#000'} };
        const base64ToUint8Array = (base64) => { const binaryString = window.atob(base64); const len = binaryString.length; const bytes = new Uint8Array(len); for (let i = 0; i < len; i++) { bytes[i] = binaryString.charCodeAt(i); } return bytes.buffer; };

        // --- 全能版视觉分析 API ---
        const analyzeImageUniversal = async (base64Data, prompt, config) => {
            const { provider, apiKey, model, baseUrl } = config;
            const effectiveKey = (apiKey || '').trim();

            if (!effectiveKey) throw new Error("Missing API Key");

            // 🌟 终极强力提取器：深度反转义 + 句号拆分语义兜底
            const extractCleanText = (content) => {
                if (!content) return "";
                
                let textToProcess = typeof content === 'string' ? content : JSON.stringify(content);
                
                // 1. 深度反转义：解决模型可能转义换行符和标签符号的问题
                textToProcess = textToProcess.replace(/\\u003c/gi, '<')
                                             .replace(/\\u003e/gi, '>')
                                             .replace(/\\n/g, '\n')
                                             .replace(/\\"/g, '"')
                                             .replace(/\\\\/g, '\\');

                // 2. 尝试剥离外层 JSON 壳 (只在合法时剥离，防止正则误伤)
                try {
                    let jsonStr = textToProcess.replace(/["']\s*，\s*["']/g, '","').replace(/}\s*，\s*{/g, '},{');
                    const parsed = JSON.parse(jsonStr);
                    if (Array.isArray(parsed)) {
                        for (const item of parsed) {
                            if (item.text) { textToProcess = String(item.text); break; }
                            if (item.content) { textToProcess = String(item.content); break; }
                        }
                    } else if (parsed.text) textToProcess = String(parsed.text); 
                    else if (parsed.content) textToProcess = String(parsed.content); 
                } catch (e) {
                    const jsonMatch = textToProcess.match(/"(?:text|content|output_text)"\s*[:：]\s*"([\s\S]*?)"(?=\s*[,}])/i);
                    if (jsonMatch && jsonMatch[1]) textToProcess = jsonMatch[1];
                }

                // 3. 抹杀所有标准包裹的思考过程
                textToProcess = textToProcess.replace(/<think>[\s\S]*?<\/think>/gi, '');
                
                // 4. 🌟 首选提取：<RESULT> 标签 (兼容多行、大小写变体)
                const resultTagMatch = textToProcess.match(/<RESULT>\s*([\s\S]*?)\s*(?:<\/RESULT>|$)/i);
                if (resultTagMatch && resultTagMatch[1]) {
                    let finalClean = resultTagMatch[1].trim();
                    finalClean = finalClean.replace(/^\["?|"?\]$/g, '').replace(/^["']|["']$/g, '');
                    return finalClean;
                }

                // 5. 暴力特征兜底：如果 AI 没写标签而且变成戏精，启动标点拆分搜索
                textToProcess = textToProcess.replace(new RegExp('\`{3}(?:json)?', 'gi'), '');
                const thinkIndex = textToProcess.toLowerCase().lastIndexOf('</think>');
                if (thinkIndex !== -1) textToProcess = textToProcess.substring(thinkIndex + 8);
                
                // 【核心修复】按句号/感叹号/问号/换行拆分成独立的句子，应对大段没换行的连篇废话
                let sentences = textToProcess.split(/[。！？\n]/).map(l => l.trim()).filter(l => l.length > 5);
                let finalLine = "";
                
                // 倒着找带有至少两个逗号/顿号的句子（刚好对应我们要的：景别，风格，描述）
                for (let i = sentences.length - 1; i >= 0; i--) {
                    // 剥除句子开头的戏精前缀
                    let s = sentences[i].replace(/^(整理下|等下|也就是|对|结果是|输出|描述|画面描述|最终结果|最终描述|最终回答|示例|那么)[：:\s，,]*/i, '').trim();
                    // 剥除句子结尾的肯定类废话
                    s = s.replace(/[，,]\s*(对|就这个|然后放标签里|对吧|是不是|就这样|嗯|没问题).*$/i, '');
                    
                    if (s.length > 10 && (s.includes('，') || s.includes(',') || s.includes('、'))) {
                        finalLine = s;
                        break; // 找到了最核心的描述句子，立刻停止搜索
                    }
                }
                
                if (!finalLine && sentences.length > 0) {
                    finalLine = sentences[sentences.length - 1].replace(/^(整理下|结果是|输出|描述|画面描述)[：:\s]*/i, '').trim();
                }

                finalLine = finalLine.replace(/^\["?|"?\]$/g, '').replace(/^["']|["']$/g, '');
                return finalLine.trim();
            };

            let rawContent = "";

            if (provider === 'google') {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${model || 'gemini-2.5-flash'}:generateContent?key=${effectiveKey}`;
                const payload = { contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: "image/jpeg", data: base64Data } }] }] };
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!response.ok) { const errText = await response.text(); throw new Error(`Google API Error: ${response.status} - ${errText}`); }
                const data = await response.json();
                rawContent = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
            } 
            else if (provider === 'volcengine') {
                const targetUrl = baseUrl || 'https://ark.cn-beijing.volces.com/api/v3/responses';
                const payload = {
                    model: model || 'doubao-seed-2-0-pro-260215', 
                    input: [ { role: "user", content: [ { type: "input_image", image_url: `data:image/jpeg;base64,${base64Data}` }, { type: "input_text", text: prompt } ] } ]
                };
                const response = await fetch(targetUrl, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${effectiveKey}` }, body: JSON.stringify(payload) });
                
                if (!response.ok) {
                    const errText = await response.text(); let errMsg = `API Error: ${response.status} - ${errText}`;
                    try { const errObj = JSON.parse(errText); if (errObj.error && errObj.error.message) { errMsg = `API 请求失败: ${errObj.error.message}`; } } catch (e) {}
                    throw new Error(errMsg);
                }
                const data = await response.json();
                if (data.output?.text) rawContent = data.output.text;
                else if (data.choices?.[0]?.message?.content) rawContent = data.choices[0].message.content;
                else if (data.output?.choices?.[0]?.message?.content) rawContent = data.output.choices[0].message.content;
                else rawContent = JSON.stringify(data);
            }
            else if (provider === 'openai') {
                const targetUrl = (baseUrl || 'https://api.openai.com/v1').replace(/\/$/, '') + '/chat/completions';
                const payload = {
                    model: model || 'gpt-4o-mini', 
                    messages: [ { role: "user", content: [ { type: "text", text: prompt }, { type: "image_url", image_url: { url: `data:image/jpeg;base64,${base64Data}` } } ] } ]
                };
                const response = await fetch(targetUrl, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${effectiveKey}` }, body: JSON.stringify(payload) });
                
                if (!response.ok) {
                    const errText = await response.text(); let errMsg = `API Error: ${response.status} - ${errText}`;
                    try { const errObj = JSON.parse(errText); if (errObj.error && errObj.error.message) { errMsg = `API 请求失败: ${errObj.error.message}`; } } catch (e) {}
                    throw new Error(errMsg);
                }
                const data = await response.json();
                rawContent = data.choices?.[0]?.message?.content || "";
            }

            return extractCleanText(rawContent);
        };

        // --- UI 组件区 ---
        const Modal = ({ isOpen, title, message, type = 'alert', onConfirm, onCancel, customButtons, texts }) => {

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 fade-in">
                    <div className="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden slide-in">
                        <div className="p-5">
                            <h3 className="text-lg font-bold text-white mb-2 flex items-center gap-2">
                                {type === 'danger' && <Trash2 size={20} className="text-red-500"/>}
                                {type === 'success' && <Check size={20} className="text-green-500"/>}
                                {type === 'switch' && <RotateCcw size={20} className="text-amber-500"/>}
                                {title}
                            </h3>
                            <p className="text-slate-300 text-sm leading-relaxed whitespace-pre-wrap">{message}</p>
                        </div>
                        <div className="bg-slate-950/50 p-4 flex justify-end gap-3 border-t border-slate-800">
                            {customButtons ? (

                    const frame = frames[i]; let shot = "-", style = "-", desc = frame.description;
                    const parts = frame.description.split(/[，,]/);
                    if (parts.length >= 3) {
                        shot = parts[0].trim();
                        style = parts[1].trim();
                        desc = parts.slice(2).join('，').trim();
                    } else if (parts.length === 2) {
                        shot = parts[0].trim();
                        desc = parts[1].trim();
                    }
                    
                    // 🌟 填入数据，包括秒数
                    const row = worksheet.addRow({ 
                        no: i + 1, 
                        time: frame.time.toFixed(2), 
                        shot: shot, 
                        style: style, 
                        image: '', 
                        description: desc 
                    }); 
                    row.height = 90;
                    
                    // 🌟 调整居中样式，包含前4列（编号、时间、景别、风格）
                    row.eachCell({ includeEmpty: true }, (cell) => { 
                        cell.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true }; 
                        if(cell.col === 1 || cell.col === 2 || cell.col === 3 || cell.col === 4) cell.alignment.horizontal = 'center'; 
                    });
                    
                    const base64Data = frame.dataUrl.split(',')[1]; const imageId = workbook.addImage({ buffer: base64ToUint8Array(base64Data), extension: 'jpeg', });
                    const aspectRatio = frame.width / frame.height; const displayHeight = 100; const displayWidth = displayHeight * aspectRatio;
                    
                    // 🌟 图片位置从 3.1 顺延到 4.1（因为前面加了一列）
                    worksheet.addImage(imageId, { tl: { col: 4.1, row: i + 1.1 }, ext: { width: displayWidth, height: displayHeight }, editAs: 'oneCell' });
                }
                const headerRow = worksheet.getRow(1); headerRow.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 12 }; headerRow.alignment = { vertical: 'middle', horizontal: 'center' }; headerRow.height = 30; headerRow.eachCell((cell) => { cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF4F46E5' } }; cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} }; });
                const buffer = await workbook.xlsx.writeBuffer(); const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }); window.saveAs(blob, "storyboard_分镜表.xlsx");
            };

            const totalQuota = freeQuota + premiumQuota;

            return (
                <div className="min-h-screen text-slate-200 font-sans selection:bg-indigo-500/30 pb-20 relative overflow-hidden">
                    <Modal {...modalConfig} texts={{ cancel: t.cancel, confirm: t.confirm }} />
                    <RechargeModal isOpen={showRecharge} onClose={() => setShowRecharge(false)} onActivate={handleActivateCode} t={t} />
                    <UpdateModal isOpen={showUpdate} onClose={() => setShowUpdate(false)} t={t} />
                    
                    <div className="fixed inset-0 w-full h-full bg-slate-950 -z-10"></div>
                    
                    {/* Move canvas outside of main flow but keep in DOM to ensure they are available */}
                    <div style={{display: 'none'}}>
                        <canvas ref={canvasRef} />
                        <canvas ref={processingCanvasRef} />
                    </div>

                    <div className="relative z-10">
                        <header className="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
                            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                                <div className="flex items-center gap-2">
                                    <div className="bg-indigo-500 p-1.5 rounded-lg shadow-indigo-500/20 shadow-lg"><Film className="w-6 h-6 text-white" /></div>
                                    <h1 className="text-xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent hidden sm:block">{t.title}</h1>
                                </div>
                                <div className="flex items-center gap-4">
                                    <button onClick={() => setShowRecharge(true)} className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-full px-3 py-1.5 transition-all group">
                                        <CreditCard size={14} className="text-amber-400 group-hover:scale-110 transition-transform" />
                                        <div className="flex flex-col text-[10px] leading-tight text-left">
                                            <span className="text-slate-400">{t.quotaLeft}</span>
                                            <span className="font-bold text-white tracking-wider">{totalQuota}</span>
                                        </div>
                                    </button>

                                    <div className="flex bg-slate-800 rounded-lg p-1 border border-slate-700">
                                        <button onClick={() => setLang('zh')} className={`px-2 py-1 text-xs font-medium rounded-md ${lang === 'zh' ? 'bg-slate-600 text-white' : 'text-slate-400'}`}>中文</button>
                                        <button onClick={() => setLang('en')} className={`px-2 py-1 text-xs font-medium rounded-md ${lang === 'en' ? 'bg-slate-600 text-white' : 'text-slate-400'}`}>EN</button>
                                    </div>
                                </div>
                            </div>
                        </header>
                        
                        <main className="max-w-7xl mx-auto px-4 py-8 grid lg:grid-cols-12 gap-8">
                            <div className="lg:col-span-7 space-y-6">
                                <div className={`relative group aspect-video bg-slate-900/80 backdrop-blur-sm rounded-2xl border-2 border-dashed overflow-hidden transition-all shadow-2xl ${dragActive ? 'border-indigo-500 bg-indigo-500/10' : 'border-slate-800'} ${videoSrc ? 'border-none bg-black' : ''}`}
                                    onDragEnter={(e)=>{e.preventDefault();setDragActive(true)}} onDragLeave={(e)=>{e.preventDefault();setDragActive(false)}} onDragOver={(e)=>e.preventDefault()} onDrop={(e)=>{e.preventDefault();setDragActive(false);if(e.dataTransfer.files?.[0])handleFile(e.dataTransfer.files[0])}}>
                                    {videoSrc ? (
                                        <>
                                            <video ref={videoRef} src={videoSrc} className="w-full h-full object-contain" onTimeUpdate={()=>setCurrentTime(videoRef.current?.currentTime||0)} onLoadedMetadata={()=>setDuration(videoRef.current?.duration||0)} onClick={()=>{if(videoRef.current?.paused){videoRef.current.play();setIsPlaying(true)}else{videoRef.current?.pause();setIsPlaying(false)}}} />
                                            <button onClick={(e) => { e.stopPropagation(); handleRemoveVideo(); }} className="absolute top-4 right-4 p-2 bg-black/60 hover:bg-red-600/80 text-white rounded-full transition-all z-20 opacity-0 group-hover:opacity-100" title="移除视频"><X size={20} /></button>
                                            <div className="absolute bottom-0 inset-x-0 p-4 bg-gradient-to-t from-black/90 via-black/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-4"><button onClick={()=>{if(videoRef.current?.paused){videoRef.current.play();setIsPlaying(true)}else{videoRef.current?.pause();setIsPlaying(false)}}} className="p-2 bg-white/10 hover:bg-white/20 backdrop-blur rounded-full text-white">{isPlaying ? <Pause size={20}/> : <Play size={20}/>}</button><div className="flex-1 flex flex-col gap-1"><input type="range" min="0" max={duration||100} value={currentTime} onChange={(e)=>{const val=Number(e.target.value);if(videoRef.current)videoRef.current.currentTime=val;setCurrentTime(val)}} className="w-full h-1 bg-slate-600 rounded-lg appearance-none cursor-pointer accent-indigo-500" /></div></div>
                                        </>
                                    ) : (
                                        <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-500"><div className="p-4 bg-slate-800/50 rounded-full mb-4"><Upload className="w-8 h-8 text-indigo-400" /></div><p className="text-lg font-medium text-slate-300">{t.uploadTitle}</p><p className="text-sm mt-2 text-slate-500">{t.uploadDesc}</p><input ref={fileInputRef} type="file" accept="video/*" className="hidden" onChange={(e)=>handleFile(e.target.files[0])} /><button onClick={()=>fileInputRef.current?.click()} className="mt-6 px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg shadow-lg transition-all active:scale-95">{t.selectFile}</button></div>
                                    )}
                                    {isProcessing && <div className="absolute inset-0 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center z-30 animate-in fade-in"><div className="relative w-16 h-16 mb-6"><div className="absolute inset-0 border-4 border-slate-700 rounded-full"></div><div className="absolute inset-0 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div></div><h3 className="text-white font-bold text-xl tracking-wide">{progress ? `${progress}%` : ''}</h3><p className="text-indigo-300 mt-2 text-sm font-medium animate-pulse">{processStatus}</p><button onClick={cancelProcessing} className="mt-6 px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white text-sm font-medium rounded-full transition-colors border border-slate-600">{t.cancelOp}</button></div>}
                                </div>

                                <div className="bg-slate-900/80 backdrop-blur-sm rounded-2xl border border-slate-800 shadow-xl overflow-hidden">
                                    <div className="flex border-b border-slate-800">
                                        <button onClick={()=>handleTabChange('interval')} className={`flex-1 py-4 text-sm font-medium flex items-center justify-center gap-2 transition-colors relative ${activeTab==='interval'?'text-indigo-400 bg-slate-800/30':'text-slate-400 hover:text-slate-200'}`}><Clock size={16}/>{t.tabInterval}{activeTab==='interval'&&<div className="absolute bottom-0 left-0 right-0 h-0.5 bg-indigo-500"/>}</button>
                                        <button onClick={()=>handleTabChange('scene')} className={`flex-1 py-4 text-sm font-medium flex items-center justify-center gap-2 transition-colors relative ${activeTab==='scene'?'text-purple-400 bg-slate-800/30':'text-slate-400 hover:text-slate-200'}`}><Aperture size={16}/>{t.tabScene}{activeTab==='scene'&&<div className="absolute bottom-0 left-0 right-0 h-0.5 bg-purple-500"/>}</button>
                                    </div>
                                    <div className="p-6">
                                        {activeTab === 'interval' && (
                                            <div className="space-y-6 animate-fade-in">
                                                <div className="flex items-center justify-between p-4 bg-slate-950/50 rounded-xl border border-slate-800"><div className="space-y-1"><label className="text-sm font-medium text-slate-200">{t.intervalLabel}</label><p className="text-xs text-slate-500">{t.intervalDesc}</p></div><div className="flex items-center gap-3"><input type="number" min="0.1" step="0.1" value={intervalSec} onChange={(e)=>setIntervalSec(e.target.value)} className="w-20 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-center text-indigo-300 font-mono outline-none" /><span className="text-sm text-slate-500">{t.seconds}</span></div></div>
                                                <button onClick={extractByInterval} disabled={!videoSrc||isProcessing} className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-500 text-white rounded-xl font-bold shadow-lg flex items-center justify-center gap-2 active:scale-[0.98]"><Layers size={18}/>{t.btnInterval}</button>
                                            </div>
                                        )}
                                        {activeTab === 'scene' && (
                                            <div className="space-y-6 animate-fade-in">
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div className="p-4 bg-slate-950/50 rounded-xl border border-slate-800 space-y-3"><div className="flex justify-between"><label className="text-sm font-medium text-slate-200">{t.sceneThreshold}</label><span className="text-xs font-mono text-purple-400">{sceneThreshold}%</span></div><input type="range" min="5" max="50" step="1" value={sceneThreshold} onChange={(e)=>setSceneThreshold(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-purple-500" /><p className="text-xs text-slate-500">{t.sceneThresholdDesc}</p></div>
                                                    <div className="p-4 bg-slate-950/50 rounded-xl border border-slate-800 space-y-3"><div className="flex justify-between"><label className="text-sm font-medium text-slate-200">{t.minSceneDuration}</label><span className="text-xs font-mono text-purple-400">{minSceneDuration}s</span></div><input type="range" min="0.2" max="5" step="0.1" value={minSceneDuration} onChange={(e)=>setMinSceneDuration(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-purple-500" /><p className="text-xs text-slate-500">{t.minSceneDurationDesc}</p></div>
                                                </div>
                                                <button onClick={detectSceneChanges} disabled={!videoSrc||isProcessing} className="w-full py-3 bg-purple-600 hover:bg-purple-500 disabled:bg-slate-800 disabled:text-slate-500 text-white rounded-xl font-bold shadow-lg flex items-center justify-center gap-2 active:scale-[0.98] relative overflow-hidden"><Zap size={18}/>{t.btnScene}</button>
                                            </div>
                                        )}
                                        <div className="mt-6 pt-6 border-t border-slate-800 flex gap-3">
                                            <button onClick={()=>{if(!videoRef.current)return;const f=captureFrame(videoRef.current,videoRef.current.currentTime);if(f) setFrames(prev=>[f,...prev])}} disabled={!videoSrc} className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-sm font-medium flex items-center justify-center gap-2"><Camera size={16}/>{t.btnCurrent}</button>
                                            <button onClick={extractLastFrame} disabled={!videoSrc} className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-sm font-medium flex items-center justify-center gap-2"><SkipForward size={16}/>{t.btnLast}</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="lg:col-span-5 flex flex-col h-[600px] lg:h-[calc(100vh-8rem)]">
                                <div className="bg-slate-900/80 backdrop-blur-sm rounded-2xl border border-slate-800 shadow-xl flex flex-col h-full overflow-hidden">
                                    <div className="p-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur z-10">
                                        <div className="flex justify-between items-center mb-3">
                                            <div className="flex items-center gap-2"><ImageIcon className="w-4 h-4 text-indigo-400" /><span className="font-semibold text-sm">{t.results} ({frames.length})</span></div>
                                            <div className="flex gap-2">
                                                <button onClick={()=>{if(selectedFrameIds.size===frames.length)setSelectedFrameIds(new Set());else setSelectedFrameIds(new Set(frames.map(f=>f.id)))}} className="text-[10px] px-2 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-300">{selectedFrameIds.size===frames.length&&frames.length>0?t.deselect:t.selectAll}</button>
                                                <button onClick={clearAllFrames} className="text-[10px] px-2 py-1 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 rounded transition-colors">{t.clearAll}</button>
                                            </div>
                                        </div>
                                        {/* AI 智能分析按钮 */}
                                        {frames.length>0 && (
                                            <button 
                                                onClick={runBatchAIAnalysis} 
                                                disabled={isProcessing} 
                                                className="w-full mb-3 py-2 bg-gradient-to-r from-emerald-600/20 to-teal-600/20 border border-emerald-500/30 hover:border-emerald-500/60 text-emerald-300 text-xs font-bold rounded flex items-center justify-center gap-2 transition-all group relative overflow-hidden"
                                            >
                                                <Sparkles size={14} className="group-hover:text-emerald-200 group-hover:scale-110 transition-transform"/>{t.aiAnalyzeAll}
                                                <span className="absolute right-3 text-[10px] bg-slate-900/50 px-1.5 rounded text-emerald-400 opacity-80">
                                                    需消耗 {frames.length} 额度
                                                </span>
                                            </button>
                                        )}
                                        {selectedFrameIds.size>0 && <div className="flex gap-2 animate-fade-in"><button onClick={()=>{setFrames(frames.filter(f=>!selectedFrameIds.has(f.id)));setSelectedFrameIds(new Set())}} className="flex-1 py-1.5 bg-red-600 text-white text-xs rounded flex items-center justify-center gap-1"><Trash2 size={12}/>{t.deleteSelected} ({selectedFrameIds.size})</button></div>}
                                    </div>

                                    <div className="flex-1 overflow-y-auto p-3 space-y-3 custom-scrollbar bg-slate-950/30">
                                        {frames.length===0 ? (
                                            <div className="h-full flex flex-col items-center justify-center text-slate-600 opacity-60"><Layers size={48} strokeWidth={1} className="mb-2"/><p className="text-sm">{t.noFrames}</p><p className="text-xs text-slate-700 mt-1">{t.noFramesDesc}</p></div>
                                        ) : (
                                            frames.map((frame) => (
                                                <div key={frame.id} className={`flex bg-slate-900 border rounded-lg overflow-hidden transition-all hover:shadow-lg ${selectedFrameIds.has(frame.id)?'border-indigo-500 bg-indigo-900/10':'border-slate-800 hover:border-slate-700'}`}>
                                                    <div className="w-10 flex items-center justify-center cursor-pointer hover:bg-slate-800/50 border-r border-slate-800" onClick={()=>{const newSet=new Set(selectedFrameIds);if(newSet.has(frame.id))newSet.delete(frame.id);else newSet.add(frame.id);setSelectedFrameIds(newSet)}}>
                                                        <div className={`w-4 h-4 rounded border flex items-center justify-center transition-all ${selectedFrameIds.has(frame.id)?'bg-indigo-500 border-indigo-500':'border-slate-600'}`}>{selectedFrameIds.has(frame.id)&&<Check size={10} className="text-white"/>}</div>
                                                    </div>
                                                    <div className="w-32 h-24 bg-black relative shrink-0"><img src={frame.dataUrl} className="w-full h-full object-contain"/><div className="absolute bottom-1 right-1 bg-black/70 text-[10px] px-1 rounded text-white font-mono">{frame.time.toFixed(1)}s</div></div>
                                                    <div className="flex-1 p-2 flex flex-col justify-between min-w-0">
                                                        <div className="flex justify-between items-start h-full"><textarea value={frame.description} onChange={(e)=>{setFrames(prev=>prev.map(f=>f.id===frame.id?{...f,description:e.target.value}:f))}} className="bg-transparent text-xs text-slate-300 border-none focus:ring-0 outline-none w-full h-full resize-none placeholder-slate-600 leading-relaxed" placeholder="Description..." /></div>
                                                        <div className="flex items-end justify-between mt-1">
                                                            <div className="flex gap-2">
                                                                <div className="flex items-center gap-1 text-[10px] text-slate-500 bg-slate-800 px-1.5 py-0.5 rounded"><div className="w-2 h-2 rounded-full" style={{background:frame.meta.color}}></div>{t.dominantColor}</div>
                                                                {frame.meta.diffScore&&<div className="flex items-center gap-1 text-[10px] text-purple-400 bg-purple-900/20 px-1.5 py-0.5 rounded"><Zap size={8}/>{t.changeScore}: {frame.meta.diffScore}%</div>}
                                                            </div>
                                                            <a href={frame.dataUrl} download={`frame_${frame.time}.jpg`} className="p-1.5 bg-slate-800 hover:bg-slate-700 rounded text-slate-400 hover:text-white transition-colors"><Download size={14}/></a>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                    <div className="p-4 border-t border-slate-800 bg-slate-900 space-y-3">
                                        <button onClick={downloadStoryboard} disabled={frames.length===0} className="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl border border-slate-700 flex items-center justify-center gap-2 transition-all disabled:opacity-50"><FileSpreadsheet size={18}/>{t.downloadXlsx}</button>
                                        <button onClick={downloadZip} disabled={frames.length===0} className="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold rounded-xl shadow-lg flex items-center justify-center gap-2 transition-all disabled:opacity-50 disabled:cursor-not-allowed"><FileVideo size={18}/>{t.downloadZip}</button>
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>

                    {/* 🌟 页面左下角悬浮：更新日志按钮 */}
                    <button 
                        onClick={() => setShowUpdate(true)}
                        className="fixed bottom-6 left-6 z-40 flex items-center gap-2 px-3 py-2 bg-slate-800/80 hover:bg-slate-700/80 backdrop-blur border border-slate-700 rounded-full text-xs text-slate-400 hover:text-slate-200 transition-all shadow-lg group"
                    >
                        <Info size={16} className="text-indigo-400 group-hover:scale-110 transition-transform" />
                        <span className="hidden sm:inline font-medium">{t.updateBtn}</span>
                    </button>
                </div>
            );
        };

        // 启动应用
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
